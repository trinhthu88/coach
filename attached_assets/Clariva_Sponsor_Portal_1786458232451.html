document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 300; font-size: clamp(30px,3.4vw,46px); line-height: 1.04; letter-spacing: -.03em; margin: 12px 0 0;\">Your leaders, <span style=\"font-style: italic; color: #2c8fa8;\">in aggregate<\u002Fspan>.<\u002Fh1>\n              <p style=\"margin: 12px 0 0; color: #6a6560; font-size: 14.5px; max-width: 56ch; text-wrap: pretty;\">{{ dashSub }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- cohort segment -->\n          <div style=\"margin-top: 26px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\">\n            <div style=\"display: flex; gap: 3px; background: #ede9e1; padding: 4px; border-radius: 13px; flex-wrap: wrap;\">\n              <sc-for list=\"{{ segs }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"border: 0; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; padding: 8px 14px; border-radius: 10px; background: {{ s.bg }}; color: {{ s.fg }}; box-shadow: {{ s.sh }}; display: flex; align-items: center; gap: 7px; white-space: nowrap; transition: all .22s;\">\n                  {{ s.label }}\n                  <span style=\"font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: {{ s.cbg }}; color: {{ s.cfg }};\">{{ s.count }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <a href=\"#cohorts\" sc-camel-on-click=\"{{ goCohorts }}\" style=\"font-size: 11.5px; font-weight: 600; color: #2c8fa8; cursor: pointer;\">Compare all cohorts →<\u002Fa>\n          <\u002Fdiv>\n\n          <!-- ── EMPTY / FIRST LOGIN ── -->\n          <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 22px; animation: fadein .35s both;\">\n              <div style=\"border-radius: 24px; background: #fff; border: 1px solid rgba(214,207,196,.75); box-shadow: 0 4px 12px -2px rgba(10,28,38,.08); padding: 40px 40px 34px; display: flex; gap: 40px; flex-wrap: wrap;\">\n                <div style=\"flex: 1; min-width: 300px;\">\n                  <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 9.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #2c8fa8; background: #e4f5fa; padding: 6px 12px; border-radius: 999px;\">Programme starts in 6 days<\u002Fdiv>\n                  <h2 style=\"font-family: Fraunces, serif; font-weight: 300; font-size: 30px; line-height: 1.12; letter-spacing: -.025em; margin: 18px 0 0; max-width: 24ch;\">Everything is set. Data appears as sessions happen.<\u002Fh2>\n                  <p style=\"margin: 12px 0 0; color: #6a6560; font-size: 14px; max-width: 50ch; text-wrap: pretty;\">Eight leaders have accepted their invitations for Autumn Leaders '26. Your first metrics — participation, self-rated progress and satisfaction — populate after each leader's first session.<\u002Fp>\n                  <div style=\"margin-top: 26px; display: flex; flex-direction: column; gap: 2px;\">\n                    <sc-for list=\"{{ emptySteps }}\" as=\"e\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; align-items: center; gap: 13px; padding: 11px 0; border-bottom: 1px solid #f0ebe3;\">\n                        <span style=\"width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: {{ e.fill }}; border: 1.5px solid {{ e.ring }}; color: {{ e.fg }}; display: grid; place-items: center; font-size: 10px; font-weight: 700;\">{{ e.mark }}<\u002Fspan>\n                        <span style=\"font-size: 13px; font-weight: 500; color: {{ e.textFg }};\">{{ e.label }}<\u002Fspan>\n                        <span style=\"margin-left: auto; font-size: 10.5px; color: #6a6560;\">{{ e.meta }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width: 268px; flex-shrink: 0;\">\n                  <div style=\"border-radius: 20px; background: #f6f3ee; border: 1px solid #e2dbd0; padding: 22px;\">\n                    <div style=\"font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #6a6560;\">Awaiting first session<\u002Fdiv>\n                    <div style=\"font-family: Fraunces, serif; font-weight: 300; font-size: 46px; line-height: 1; margin-top: 12px;\">8<\u002Fdiv>\n                    <div style=\"font-size: 11.5px; color: #6a6560; margin-top: 6px;\">of 8 leaders enrolled<\u002Fdiv>\n                    <div style=\"height: 6px; border-radius: 999px; background: #e2dbd0; margin-top: 18px; overflow: hidden;\">\n                      <div style=\"height: 100%; width: 100%; background: #d6cfc4;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 9px;\">\n                      <sc-for list=\"{{ emptyPending }}\" as=\"p\" hint-placeholder-count=\"4\">\n                        <div style=\"display: flex; align-items: center; gap: 9px;\">\n                          <span style=\"width: 24px; height: 24px; border-radius: 50%; background: #ede9e1; color: #6a6560; display: grid; place-items: center; font-size: 9.5px; font-weight: 700;\">{{ p.ini }}<\u002Fspan>\n                          <span style=\"font-size: 11.5px; color: #6a6560;\">{{ p.label }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top: 12px; font-size: 10.5px; line-height: 1.5; color: #6a6560; display: flex; gap: 8px;\">\n                    <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3db4d0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fs -width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 14px; height: 14px;\"><path d=\"{{ k.d }}\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <!-- GOAL GROWTH + SIDE CARDS -->\n              <div style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); gap: 16px; align-items: start;\">\n\n                <div style=\"grid-column: {{ growthSpan }}; border-radius: 22px; background: #fff; border: 1px solid rgba(214,207,196,.7); box-shadow: 0 4px 12px -2px rgba(10,28,38,.08); padding: 22px 24px 24px;\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                    <p style=\"margin: 0; font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #6a6560;\">Goal growth<\u002Fp>\n                    <span style=\"font-size: 10.5px; color: #6a6560;\">Self-rated, 0–10 scale · {{ growthWindow }}<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div style=\"margin-top: 20px; display: flex; gap: 34px; flex-wrap: wrap;\">\n                    <div>\n                      <div style=\"font-family: Fraunces, serif; font-weight: 300; font-size: 52px; line-height: 1; letter-spacing: -.03em; color: #0f7a5f;\">{{ avgGrowth }}<\u002Fdiv>\n                      <div style=\"font-size: 11px; color: #6a6560; margin-top: 8px; max-width: 22ch;\">average growth in self-rated progress since baseline<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-family: Fraunces, serif; font-weight: 300; font-size: 52px; line-height: 1; letter-spacing: -.03em;\">{{ pctProgressing }}<span style=\"font-size: 24px; color: #6a6560;\">%<\u002Fspan><\u002Fdiv>\n                      <div style=\"font-size: 11px; color: #6a6560; margin-top: 8px; max-width: 22ch;\">progressing toward their target rating<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <!-- distribution -->\n                  <sc-if value=\"{{ showDist }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top: 26px; padding-top: 22px; border-top: 1px solid #f0ebe3;\">\n                      <p style=\"margin: 0 0 16px; font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #6a6560;\">Distribution · {{ distCount }} leaders<\u002Fp>\n                      <div style=\"display: flex; flex-direction: column; gap: 13px;\">\n                        <sc-for list=\"{{ buckets }}\" as=\"b\" hint-placeholder-count=\"4\">\n                          <div style=\"display: flex; align-items: center; gap: 14px;\">\n                            <span style=\"width: 148px; flex-shrink: 0; font-size: 11.5px; font-weight: 500; color: #0a1c26;\">{{ b.label }}<\u002Fspan>\n                            <div style=\"flex: 1; min-width: 60px; height: 22px; border-radius: 7px; background: #f3efe8; overflow: hidden;\">\n                              <div style=\"height: 100%; width: {{ b.w }}; background: {{ b.fill }}; border-radius: 7px; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both;\"><\u002Fdiv>\n                            <\u002Fdiv>\n                            <span style=\"width: 62px; text-align: right; flex-shrink: 0; font-size: 12px; font-weight: 600;\">{{ b.n }} <span style=\"color: #6a6560; font-weight: 500;\">{{ b.pct }}<\u002Fspan><\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <!-- suppressed state -->\n                  <sc-if value=\"{{ suppressed }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top: 26px; padding: 22px; border-radius: 18px; background: #f6f3ee; border: 1px dashed #d6cfc4; animation: fadein .3s both;\">\n                      <div style=\"display: flex; align-items: flex-start; gap: 13px;\">\n                        <span style=\"width: 30px; height: 30px; flex-shrink: 0; border-radius: 10px; background: #ede9e1; color: #6a6560; display: grid; place-items: center;\">\n                          <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 15px; height: 15px;\"><path d=\"M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fspan>\n                        <div>\n                          <p style=\"margin: 0; font-size: 12.5px; font-weight: 600;\">Distribution hidden — cohort under 5 leaders<\u002Fp>\n                          <p style=\"margin: 7px 0 0; font-size: 12px; line-height: 1.55; color: #6a6560; max-width: 52ch;\">With {{ distCount }} leaders in {{ segLabel }}, a breakdown could identify individuals. The cohort average above is shown instead. Breakdowns unlock at 5 leaders, or view this cohort inside a rolled-up total.<\u002Fp>\n                          <button sc-camel-on-click=\"{{ selAll }}\" style=\"margin-top: 13px; height: 30px; padding: 0 13px; border-radius: 9px; border: 1px solid #d6cfc4; background: #fff; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; color: #2c8fa8;\" style-hover=\"border-color: #3db4d0;\">View rolled up across all cohorts<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n                  <!-- timeline -->\n                  <div style=\"border-radius: 22px; background: linear-gradient(135deg,#062f3e 0%,#0a4256 55%,#04202b ursor }}; font: inherit; font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: {{ c.fg }}; text-align: {{ c.align }}; display: block;\">{{ c.label }}{{ c.arrow }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                      <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"width: 100%; border: 0; background: {{ r.bg }}; cursor: pointer; font: inherit; text-align: left; display: grid; grid-template-columns: 1.5fr 1.25fr .9fr 1.5fr .8fr .9fr 34px; gap: 14px; align-items: center; padding: 13px 24px; border-bottom: 1px solid #f6f3ee; transition: background .16s;\" style-hover=\"background: #faf8f4;\">\n                        <span style=\"display: flex; align-items: center; gap: 10px; min-width: 0;\">\n                          <span style=\"width: 27px; height: 27px; flex-shrink: 0; border-radius: 50%; background: {{ r.avBg }}; color: {{ r.avFg }}; display: grid; place-items: center; font-size: 10px; font-weight: 700;\">{{ r.ini }}<\u002Fspan>\n                          <span style=\"font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ r.name }}<\u002Fspan>\n                        <\u002Fspan>\n                        <span style=\"font-size: 11.5px; color: #6a6560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ r.cohort }}<\u002Fspan>\n                        <span style=\"display: flex;\">\n                          <span style=\"display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border-radius: 999px; padding: 3px 9px; font-size: 10px; font-weight: 700; background: {{ r.stBg }}; color: {{ r.stFg }};\">\n                            <span style=\"width: 5px; height: 5px; border-radius: 50%; background: {{ r.stDot }};\"><\u002Fspan>{{ r.status }}\n                          <\u002Fspan>\n                        <\u002Fspan>\n                        <span style=\"display: flex; align-items: center; gap: 10px;\">\n                          <span style=\"flex: 1; min-width: 40px; height: 5px; border-radius: 999px; background: #ede9e1; overflow: hidden; display: block;\">\n                            <span style=\"display: block; height: 100%; width: {{ r.pctW }}; background: {{ r.barFill }}; border-radius: 999px;\"><\u002Fspan>\n                          <\u002Fspan>\n                          <span style=\"width: 32px; font-size: 11px; font-weight: 600; color: #6a6560; text-align: right;\">{{ r.pct }}<\u002Fspan>\n                        <\u002Fspan>\n                        <span style=\"font-size: 12px; color: #0a1c26; font-variant-numeric: tabular-nums;\">{{ r.sessions }}<\u002Fspan>\n                        <span style=\"font-size: 12.5px; font-weight: 700; color: {{ r.growthFg }}; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.growth }}<\u002Fspan>\n                        <span style=\"display: grid; place-items: center; color: #c2bab0;\">\n                          <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 14px; height: 14px;\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"padding: 14px 24px; display: flex; align-items: center; gap: 10px; background: #faf8f4; font-size: 11px; color: #6a6560;\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#a89f93\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 13px; height: 13px; flex-shrink: 0;\"><path d=\"M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n                  Goal titles, session notes and messages are not part of this table — by design, not by permission level.\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- PRIVACY NOTICE -->\n          <div style=\"margin-top: 16px; border-radius: 22px; background: #fff; border: 1px solid rgba(61,180,208,.28); padding: 22px 24px; display: flex; gap: 18px; flex-wrap: wrap;\">\n            <div style=\"width: 34px; height: 34px; flex-shrink: 0; border-radius: 11px; background: #e4f5fa; color: #2c8fa8; display: grid; place-items: center;\">\n              <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 17px; height: 17px;\"><path d=\"M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-width: 260px;\">\n              <p style=\"margin: 0; font-size: 13px; font-weight: 600;\">What stays between leader and coach<\u002Fp>\n              <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: #6a6560; max-width: 78ch; text-wrap: pretty;\">Session notes, chat messages, reflections and the wording of goals are never shared with sponsors. You see whether sessions happened, how leaders rate their own progress, and how they rate their coaching. Every leader can see the same view of themselves that you see.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start;\">\n              <sc-for list=\"{{ privChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: #6a6560; background: #f6f3ee; border: 1px solid #e2dbd0; border-radius: 999px; padding: 5px 11px;\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#a89f93\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width: 11px; height: 11px;\"><path d=\"M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n                  {{ c.label }}\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══════════ COHORTS ══════════ -->\n      <sc-if value=\"{{ atCohorts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation: rise .5s cubic-bezier(.2,.8,.2,1) both;\">\n          <div style=\"font-size: 10px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #3db4d0;\">Across programmes<\u002Fdiv>\n          <h1 style=\"font-family: Fraunces, serif; font-weight: 300; font-size: clamp(30px,3.2vw,42px); line-height: 1.05; letter-spacing: -.03em; margin: 12px 0 0;\">Two cohorts, <span style=\"font-style: italic; color: #2c8fa8;\">one budget<\u002Fspan>.<\u002Fh1>\n          <p style=\"margin: 12px 0 0; color: #6a6560; font-size: 14.5px; max-width: 60ch; text-wrap: pretty;\">Rolled up across everything you sponsor, then split by cohort. Drill into either to filter the whole dashboard.<\u002Fp>\n\n          <!-- rollup -->\n          <div style=\"margin-top: 26px; border-radius: 22px; background: #fff; border: 1px solid rgba(214,207,196,.7); box-shadow: 0 4px 12px -2px rgba(10,28,38,.08); padding: 22px 24px;\">\n            <p style=\"margin: 0; font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #6a6560;\">Rolled up · all cohorts<\u002Fp>\n            <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 22px;\">\n              <sc-for list=\"{{ rollup }}\" as=\"u\" hint-placeholder-count=\"5\">\n                <div>\n                  <div style=\"font-family: Fraunces, serif; font-weight: 300; font-size: 32px; line-height: 1; letter-spacing: -.03em; color: {{ u.fg }};\">{{ u.value }}<\u002Fdiv>\n                  <div style=\"font-size: 10.5px; color: #6a6560; margin-top: 8px;\">{{ u.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- cohort cards -->\n          <div style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit,minmax(360px,1fr)); gap: 16px;\">\n            <sc-for list=\"{{ cohortCards }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"border-radius: 22px; background: #fff; border: 1px solid rgba(214,207,196,.7); box-shadow: 0 4px 12px -2px rgba(10,28,38,.08); overflow: hidden; transition: transform .22s, box-shadow .22s;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 32px -8px rgba(10,28,38,.14);\">\n                <div style=\"padding: 20px 22px; border-bottom: 1px solid #f0ebe3;\">\n                  <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;\">\n                    <div>\n                      <h3 style=\"margin: 0; font-family: Fraunces, serif; font-weight: 400; font-size: 20px; letter-spacing: -.02em;\">{{ c.name }}<\u002Fh3>\n                      <p style=\"margin: 7px 0 0; font-size: 11.5px; color: #6a6560;\">{{ c.programme }} · {{ c.window }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span style=\"white-space: nowrap; border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 700; background: {{ c.phaseBg }}; color: {{ c.phaseFg }};\">{{ c.phase }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(4,1fr); gap: 12px;\">\n                    <sc-for list=\"{{ c.stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                      <div>\n                        <div style=\"font-size: 8.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #6a6560;\">{{ s.label }}< 0b981\" },\n      { k: \"mean\", label: \"Meaningful progress\", fill: \"#3db4d0\" },\n      { k: \"start\", label: \"Just started\", fill: \"#e8bb34\" },\n      { k: \"flat\", label: \"Flat or declined\", fill: \"#c96830\" }\n    ];\n    const buckets = bDef.map(b => {\n      const cnt = scoped.filter(l => l.b === b.k).length;\n      return { label: b.label, fill: b.fill, n: cnt, pct: Math.round((cnt / n) * 100) + \"%\", w: Math.max(cnt === 0 ? 0 : 6, (cnt / n) * 100) + \"%\" };\n    });\n\n    const filterDef = [[\"all\", \"All\"], [\"Active\", \"Active\"], [\"At risk\", \"At risk\"], [\"Paused\", \"Paused\"], [\"Completed\", \"Done\"]];\n    const filters = filterDef.map(([id, label]) => ({\n      label, onClick: () => this.setState({ filter: id }),\n      bg: s.filter === id ? \"#fff\" : \"transparent\", fg: s.filter === id ? \"#0a1c26\" : \"#6a6560\"\n    }));\n\n    const colDef = [\n      { k: \"name\", label: \"Leader\", align: \"left\" }, { k: \"cohort\", label: \"Cohort\", align: \"left\" },\n      { k: \"status\", label: \"Status\", align: \"left\" }, { k: \"pct\", label: \"Programme progress\", align: \"left\" },\n      { k: \"sessions\", label: \"Sessions\", align: \"left\" }, { k: \"growth\", label: \"Goal growth\", align: \"right\" },\n      { k: null, label: \"\", align: \"center\" }\n    ];\n    const cols = colDef.map(c => ({\n      label: c.label, align: c.align, cursor: c.k ? \"pointer\" : \"default\",\n      fg: s.sort === c.k ? \"#0a1c26\" : \"#6a6560\",\n      arrow: s.sort === c.k ? \" ↓\" : \"\",\n      onClick: c.k ? () => this.setState({ sort: c.k }) : () => {}\n    }));\n\n    let list = scoped.filter(l => s.filter === \"all\" || l.s === s.filter);\n    const sorters = {\n      name: (a, b) => a.n.localeCompare(b.n), cohort: (a, b) => a.c.localeCompare(b.c),\n      status: (a, b) => a.s.localeCompare(b.s), pct: (a, b) => b.p - a.p,\n      sessions: (a, b) => b.u - a.u, growth: (a, b) => b.g - a.g\n    };\n    list = list.slice().sort(sorters[s.sort] || sorters.name);\n\n    const rowOf = (l) => {\n      const st = this.statusMap[l.s], co = this.cohorts.find(c => c.id === l.c);\n      const tone = this.avTones[l.n.length % 4];\n      const gi = this.leaders.indexOf(l);\n      return {\n        name: l.n, ini: this.ini(l.n), cohort: co.short, status: l.s, pct: l.p + \"%\", pctW: l.p + \"%\",\n        sessions: l.u + \" / \" + co.entitled, growth: (l.g > 0 ? \"+\" : \"\") + l.g.toFixed(1),\n        growthFg: l.g >= 2 ? \"#0f7a5f\" : l.g > 0 ? \"#0a1c26\" : \"#a8501f\",\n        stBg: st.bg, stFg: st.fg, stDot: st.dot, barFill: st.bar,\n        avBg: tone.bg, avFg: tone.fg, bg: \"#fff\",\n        onClick: () => this.setState({ drawer: gi })\n      };\n    };\n    const rows = list.map(rowOf);\n\n    const tl = cohortsIn.length === 1 ? cohortsIn[0] : this.cohorts[0];\n    const tlPct = Math.round((tl.elapsed / (tl.elapsed + tl.days)) * 100);\n\n    const satStars = [1, 2, 3, 4, 5].map(i => ({ fill: satAvg >= i - 0.4 ? \"#e8bb34\" : \"#e6e0d6\" }));\n\n    const rollup = [\n      { label: \"leaders sponsored\", value: this.leaders.length, fg: \"#0a1c26\" },\n      { label: \"on track\", value: this.leaders.filter(l => l.s === \"Active\" || l.s === \"Completed\").length, fg: \"#0f7a5f\" },\n      { label: \"at risk\", value: this.leaders.filter(l => l.s === \"At risk\").length, fg: \"#a8501f\" },\n      { label: \"sessions used of 120\", value: this.leaders.reduce((t, l) => t + l.u, 0), fg: \"#0a1c26\" },\n      { label: \"avg goal growth\", value: \"+\" + (this.leaders.reduce((t, l) => t + l.g, 0) / this.leaders.length).toFixed(1), fg: \"#0f7a5f\" }\n    ];\n\n    const cohortCards = this.cohorts.map(c => {\n      const mem = this.leaders.filter(l => l.c === c.id);\n      const mixDef = [[\"Active\", \"#10b981\"], [\"At risk\", \"#c96830\"], [\"Paused\", \"#a89f93\"], [\"Completed\", \"#3db4d0\"]];\n      const mix = mixDef.map(([k, fill]) => ({ label: k, fill, n: mem.filter(l => l.s === k).length }))\n        .filter(m => m.n > 0).map(m => Object.assign(m, { w: (m.n / mem.length) * 100 + \"%\" }));\n      const cu = mem.reduce((t, l) => t + l.u, 0);\n      return {\n        name: c.name, programme: c.programme, window: c.window, phase: c.phase,\n        phaseBg: c.id === \"spring\" ? \"rgba(232,187,52,.22)\" : \"#e4f5fa\",\n        phaseFg: c.id === \"spring\" ? \"#8a6a10\" : \"#22738a\",\n        n: mem.length, mix, small: mem.length < 5,\n        stats: [\n          { label: \"Leaders\", value: mem.length, fg: \"#0a1c26\" },\n          { label: \"Sessions\", value: cu + \"/\" + mem.length * c.entitled, fg: \"#0a1c26\" },\n          { label: \"Avg growth\", value: \"+\" + (mem.reduce((t, l) => t + l.g, 0) / mem.length).toFixed(1), fg: \"#0f7a5f\" },\n          { label: \"Rating\", value: c.sat.toFixed(1), fg: \"#0a1c26\" }\n        ],\n        onDrill: () => this.setState({ screen: \"dash\", cohort: c.id, filter: \"all\" })\n      };\n    });\n\n    const periods = [\"Q2 2026\", \"Q3 2026\", \"Programme to date\"].map(p => ({\n      label: p, onClick: () => this.setState({ period: p, phase: \"idle\", step: 0 }),\n      bg: s.period === p ? \"#fff\" : \"transparent\", fg: s.period === p ? \"#0a1c26\" : \"#6a6560\"\n    }));\n    const stepLabels = [\"Reading participation records\", \"Aggregating self-rated progress\", \"Applying privacy filters\", \"Laying out one-pager\"];\n    const buildSteps = stepLabels.map((label, i) => {\n      const done = s.step > i, now = s.step === i;\n      return { label, fg: done ? \"#0a1c26\" : now ? \"#2c8fa8\" : \"#a89f93\", ring: done ? \"#10b981\" : now ? \"#3db4d0\" : \"#d6cfc4\", fill: done ? \"#10b981\" : \"transparent\", mark: done ? \"✓\" : \"\" };\n    });\n\n    const d = s.drawer == null ? null : this.leaders[s.drawer];\n    let dVals = { drawerOpen: false };\n    if (d) {\n      const co = this.cohorts.find(c => c.id === d.c), st = this.statusMap[d.s], tone = this.avTones[d.n.length % 4];\n      const monthDefs = d.c === \"spring\" ? [\"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\"] : [\"Jul\", \"Aug\"];\n      let left = d.u;\n      const per = monthDefs.map((label, i) => {\n        const take = Math.min(left, i === monthDefs.length - 1 ? left : Math.round(d.u / monthDefs.length + (i % 2 === 0 ? 0.5 : 0)));\n        left -= take;\n        return { label, v: take };\n      });\n      const maxV = Math.max(1, ...per.map(p => p.v));\n      dVals = {\n        drawerOpen: true, dName: d.n, dIni: this.ini(d.n), dCohort: co.short, dProgramme: co.programme,\n        dAvBg: tone.bg, dAvFg: tone.fg, dStatus: d.s, dStBg: st.bg, dStFg: st.fg, dStDot: st.dot, dEnrolled: d.e + \" 2026\",\n        dStats: [\n          { label: \"Programme progress\", value: d.p + \"%\", hint: \"of planned sessions\", fg: \"#0a1c26\" },\n          { label: \"Sessions\", value: d.u + \" / \" + co.entitled, hint: (co.entitled - d.u) + \" remaining\", fg: \"#0a1c26\" },\n          { label: \"Goal growth\", value: (d.g > 0 ? \"+\" : \"\") + d.g.toFixed(1), hint: \"self-rated, 0–10\", fg: d.g >= 2 ? \"#0f7a5f\" : d.g > 0 ? \"#0a1c26\" : \"#a8501f\" },\n          { label: \"Coach\", value: \"Matched\", hint: \"identity not shared\", fg: \"#6a6560\" }\n        ],\n        dMonths: per.map(p => ({ label: p.label, h: Math.max(6, (p.v / maxV) * 72) + \"px\", fill: p.v === 0 ? \"#ede9e1\" : \"#3db4d0\" })),\n        dAttendNote: d.u === 0 ? \"No sessions booked yet — first session is the trigger for all metrics.\" : d.u + \" sessions attended, 0 no-shows.\",\n        dLocked: [{ label: \"Session notes\" }, { label: \"Coach–leader messages\" }, { label: \"Goal titles and descriptions\" }, { label: \"Reflections and worksheets\" }, { label: \"Written session feedback\" }]\n      };\n    }\n\n    return Object.assign({\n      nav, modes, segs, filters, cols, rows, kpis, buckets, rollup, cohortCards, periods, buildSteps, satStars,\n      crumb: s.screen === \"dash\" ? (live ? \"Overview\" : \"Overview · first login\") : s.screen === \"cohorts\" ? \"Cohorts\" : \"Report\",\n      atDash: s.screen === \"dash\", atCohorts: s.screen === \"cohorts\", atReport: s.screen === \"report\",\n      goCohorts: this.go(\"cohorts\"), goReport: this.go(\"report\"), selAll: this.setCohort(\"all\"),\n      isEmpty: s.screen === \"dash\" && !live, hasData: s.screen === \"dash\" && live,\n      todayLabel: \"Tuesday, 11 August 2026\",\n      dashSub: live\n        ? \"Participation, self-rated progress and satisfaction for the \" + this.leaders.length + \" leaders your budget covers. No coaching content, here or anywhere in your account.\"\n        : \"Your cohort is enrolled and matched. Metrics begin the moment sessions do.\",\n      segLabel, growthSpan: \"span 1\", growthWindow: s.cohort === \"ops\" ? \"since Jul baseline\" : \"since Mar baseline\",\n      avgGrowth: (avg > 0 ? \"+\" : \"\") + avg.toFixed(1), pctProgressing: Math.round((progressing / n) * 100),\n      showDist: !suppressed, suppressed, distCount: n, buckets,\n      tlName: tl.name, tlDays: tl.days, tlPct: tlPct + \"%\", tlStart: tl.start, tlEnd: tl.end, tlWindow: tl.start + \" – \" + tl.end,\n      satAvg: satAvg.toFixed(1), satN, satRate: tl.ratedPct,\n      privChips: [{ label: \"Session notes\" }, { label: \"Chat messages\" }, { label: \"Reflections\" }, { label: \"Goal wording\" }],\n      emptySteps: [\n        { label: \"Programme purchased\", meta: \"24 Jul\", mark: \"✓\", fill: \"#10b981\", ring: \"#10b981\", fg: \"#fff\", textFg: \"#0a1c26\" },\n        { label: \"8 leaders invited and accepted\", meta: \"1 Aug\", mark: \"✓\", fill: \"#10b981\", ring: \"#10b981\", fg: \"#fff\", textFg: \"#0a1c26\" },\n        { label: \"Coach matching complete\", meta: \"8 Aug\", mark: \"✓\", fill: \"#10b981\", ring: \"#10b981\", fg: \"#fff\", textFg: \"#0a1c26\" },\n        { label: \"First sessions begin\", meta: \"17 Aug\", mark: \"\", fill: \"transparent\", ring: \"#3db4d0\", fg: \"#3db4d0\", textFg: \"#6a6560\" }\n      ],\n      empt
